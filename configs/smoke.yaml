project:
  name: cmss_hsi_smoke
  data_root: tests/toy_data
  output_dir: tests/smoke_results
  datasets:
  - River
  - Farmland
  - Hermiston
  seeds:
  - 0
  device: cpu
  progress: true
split:
  block_size: 10
  train_fraction: 0.25
  val_fraction: 0.2
  guard: 0
  max_train_per_class: 120
  max_val_per_class: 80
transforms:
- name: shift_1
  type: translation
  dx: 1.0
  dy: 0.0
experiments:
  clean_no_harm: true
  clean_no_harm_transform: clean_no_harm
correction:
  methods:
  - pc1_translation
  - pca3_translation
  - scanline_unweighted
  - cmss_k1
  - cmss
  seed: 31415
  pca_components: 3
  global_radius: 2
  row_radius: 1
  smooth_sigma: 2.0
  outer_iters: 1
baselines:
  IRMAD:
    enabled: true
    pca_components: 4
    max_iter: 4
    tolerance: 0.001
    regularization: 0.001
    sample_size: 500
  GETNET:
    enabled: true
    target_bands: 8
    normalize: channel_minmax
    plane_normalize: maxabs
    pseudo_fraction: 0.3
    max_pseudo_per_class: 64
    min_pseudo_per_class: 8
    pseudo_val_fraction: 0.2
    pool_size: 3
    epochs: 1
    batch_size: 16
    eval_batch_size: 32
    lr: 0.001
    patience: 2
    num_workers: 0
  GLAFormer:
    enabled: true
    patch_size: 6
    embed_dim: 24
    depth: 1
    heads: 4
    drop_path: 0.0
    epochs: 1
    batch_size: 16
    eval_batch_size: 32
    lr: 0.001
    patience: 2
    amp: false
    num_workers: 0
report:
  strong_baselines:
  - GLAFormer
  - GETNET
  main_transforms:
  - shift_1
  gap_min_denominator: 0.0
  noharm_max_median_drop: 0.005
